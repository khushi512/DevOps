name: Final CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI_CD_GithubActions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI_CD_GithubActions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for sensitive files
        shell: bash
        run: |
          if find . -type f \
            \( -name ".env" -o -name "*.pem" -o -name "*.key" \) \
            | grep -q .; then
            echo "Sensitive files found!"
            exit 1
          fi
          echo "No matching sensitive files found."

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: CI_CD_GithubActions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build application
        run: bash build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: CI_CD_GithubActions/build/
  
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [test, security-check, build]

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: deployment/

      - name: Deploy artifact
        run: |
          echo "Deploying calculator application..."
          test -f deployment/calculator.py
          test -f deployment/build-info.txt
          echo "Deployment successful."
          ls -la deployment/
