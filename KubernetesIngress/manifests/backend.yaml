apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command:
            - python
            - -c
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      response = (
                          f"ENVIRONMENT: {os.getenv('ENVIRONMENT')}\n"
                          f"DEFAULT_CAMPUS: {os.getenv('DEFAULT_CAMPUS')}\n"
                          f"POSTGRES_USER: {os.getenv('POSTGRES_USER')}\n"
                      )
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(response.encode())

              HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: campus-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: campus-db-secret
                  key: POSTGRES_USER
---
apiVersion: v1
kind: Service
metadata:
  name: campus-backend-service
spec:
  selector:
    app: campus-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP